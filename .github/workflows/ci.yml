name: Build
on:
  push:
  schedule:
    - cron:  '0 1 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 8
      - uses: actions/checkout@v7
      - uses: testspace-com/setup-testspace@v1
        with:
          domain: samples
      - name: Build
        run: |
          mvn clean compile
          mvn pmd:pmd
      - name: Test
        run: |
          mvn test -Dmaven.test.failure.ignore=true jacoco:report
      - name: Push
        run: |
          testspace target/pmd.xml [Tests]target/surefire-reports/TEST-TestSuite.xml target/site/jacoco/jacoco.xml
        if: always()
